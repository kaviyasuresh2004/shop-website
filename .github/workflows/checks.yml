name: Check independent shops
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shop: [bmk-arvin, sykt-sarbanan]
    defaults:
      run:
        working-directory: ${{ matrix.shop }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v test_isolation test_server test_accounts test_workers test_password_policy test_profile test_commerce test_inventory test_shopping test_photos test_categories test_inventory_audit test_company_controls test_delivery
      - run: node test_frontend.cjs
      - run: node test_account_ui.cjs
      - run: node test_manual_contact.cjs
      - run: node --check assets/site.js
      - run: node --check assets/staff.js
      - run: node --check assets/i18n.js
      - run: node --check assets/customer.js
      - run: node --check assets/recovery.js
      - run: node --check assets/workers.js
      - run: node --check assets/shop-settings.js
      - run: node --check assets/inventory.js
      - run: node --check assets/photos.js
      - run: node test_photo_ui.cjs
      - run: node --check assets/categories.js
      - run: node --check assets/branding.js
