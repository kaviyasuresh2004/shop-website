name: Check independent shops
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shop: [bmk-arvin, sykt-sarbanan]
    defaults:
      run:
        working-directory: ${{ matrix.shop }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v test_isolation test_server
      - run: node test_frontend.cjs
      - run: node --check assets/site.js
      - run: node --check assets/staff.js
      - run: node --check assets/i18n.js
